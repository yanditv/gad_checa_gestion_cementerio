services:
  sqlserver-checa:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-checa
    ports:
      - "${MSSQL_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    volumes:
      # SQL Server guarda sus datos en /var/opt/mssql. Antes se montaba en
      # /var/opt/sqlserver-checa, una ruta que el motor nunca usa: el volumen
      # quedaba vacío y la base vivía en la capa del contenedor, así que se
      # perdía al recrearlo.
      - sql_data:/var/opt/mssql
      - ./init.sql:/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -Q 'SELECT 1' -C -N" ]
      interval: 5s
      timeout: 5s
      retries: 20
      # En el primer arranque SQL Server crea/actualiza sus bases de sistema y
      # tarda varios minutos. Sin start_period se agotan los reintentos, el
      # contenedor se marca unhealthy y 'app' nunca llega a iniciar.
      start_period: 300s
    entrypoint: >
      /bin/bash -c "
        /opt/mssql/bin/sqlservr &

        echo 'Esperando que SQL Server esté listo...';

        for i in {1..30}; do
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -Q 'SELECT 1' -C -N && break
          sleep 1
        done

        echo 'Ejecutando script SQL...';
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -i /init.sql -C -N

        wait
      "
    env_file:
      - .env
    networks:
      - cementerio-net

  app:
    build:
      context: .
      dockerfile: gad_checa_gestion_cementerio/Dockerfile
    ports:
      - "3005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_CONNECTION_STRING=Server=sqlserver-checa;Database=${MSSQL_DATABASE};User=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;ConnectRetryCount=5;ConnectRetryInterval=10;
    depends_on:
      sqlserver-checa:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cementerio-net
    volumes:
      - ./data-protection-keys:/app/keys:rw
    healthcheck:
      # La ruta real es /api/Health (HealthController usa [Route("api/[controller]")]).
      # Se usa wget porque la imagen final no trae curl instalado.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/Health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # El primer arranque aplica migraciones y siembra datos iniciales.
      start_period: 180s
    command: >
      /bin/bash -c "
        echo 'Esperando que SQL Server esté completamente listo...';
        sleep 10;
        dotnet gad_checa_gestion_cementerio.dll
      "

volumes:
  sql_data:
    driver: local
  data-protection-keys:
    driver: local

networks:
  cementerio-net:
    driver: bridge